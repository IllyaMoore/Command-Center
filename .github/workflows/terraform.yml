---
name: Terraform

"on":
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "us-east-2"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      shared: ${{ steps.check.outputs.shared }}
      env: ${{ steps.check.outputs.env }}
    steps:
      - uses: dorny/paths-filter@v3
        id: check
        with:
          filters: |
            shared:
              - 'infra/shared/**'
              - 'infra/modules/networking/**'
            env:
              - 'infra/*.tf'
              - 'infra/envs/**'
              - 'infra/modules/compute/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.env == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint (shared)
        working-directory: infra/shared
        run: tflint --init

      - name: Run tflint (shared)
        working-directory: infra/shared
        run: tflint --recursive --minimum-failure-severity=error

      - name: Init tflint (env)
        working-directory: infra
        run: tflint --init

      - name: Run tflint (env)
        working-directory: infra
        run: tflint --recursive --minimum-failure-severity=error

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.env == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec (shared)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/shared
          soft_fail: true

      - name: Run tfsec (env)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: true

  plan-shared:
    name: Plan (shared)
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.shared == 'true'
      && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::796196972655:role/nanoclaw-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra/shared
        run: terraform init -backend-config="key=nanoclaw/shared/terraform.tfstate"

      - name: Terraform Validate
        working-directory: infra/shared
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/shared
        run: |
          set -o pipefail
          terraform plan \
            -no-color \
            -out=tfplan-shared \
            2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/shared/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            const outcome = process.env.PLAN_OUTCOME;
            const sha = process.env.COMMIT_SHA;
            const icon = outcome === 'success' ? 'pass' : 'FAIL';
            const body = [
              `### Terraform Plan [${icon}]: \`shared\``,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `*Commit: ${sha}*`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.env == 'true'
      && !failure() && !cancelled()
    env:
      PLAN_ENV: ${{ github.base_ref == 'staging' && 'staging' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::796196972655:role/nanoclaw-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra
        env:
          BE_KEY: nanoclaw/${{ env.PLAN_ENV }}/terraform.tfstate
        run: terraform init -backend-config="key=$BE_KEY"

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan \
            -var-file=envs/${{ env.PLAN_ENV }}.tfvars \
            -no-color \
            -out=tfplan-${{ env.PLAN_ENV }} \
            2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_ENV: ${{ env.PLAN_ENV }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            const env = process.env.PLAN_ENV;
            const outcome = process.env.PLAN_OUTCOME;
            const sha = process.env.COMMIT_SHA;
            const icon = outcome === 'success' ? 'pass' : 'FAIL';
            const body = [
              `### Terraform Plan [${icon}]: \`${env}\``,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `*Commit: ${sha}*`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-shared:
    name: Apply (shared)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master')
    environment: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for shared changes
        id: shared-changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(shared/|modules/networking/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No shared infra changes - skipping apply"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.shared-changes.outputs.changed == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: steps.shared-changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::796196972655:role/nanoclaw-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        if: steps.shared-changes.outputs.changed == 'true'
        working-directory: infra/shared
        run: >-
          terraform init
          -backend-config="key=nanoclaw/shared/terraform.tfstate"

      - name: Terraform Apply
        if: steps.shared-changes.outputs.changed == 'true'
        working-directory: infra/shared
        run: >-
          terraform apply
          -auto-approve

  apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    needs: [apply-shared]
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::796196972655:role/nanoclaw-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra
        run: >-
          terraform init
          -backend-config="key=nanoclaw/staging/terraform.tfstate"

      - name: Terraform Apply
        working-directory: infra
        run: >-
          terraform apply
          -var-file=envs/staging.tfvars
          -auto-approve

  apply-prod:
    name: Apply (prod)
    runs-on: ubuntu-latest
    needs: [apply-shared]
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::796196972655:role/nanoclaw-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra
        run: >-
          terraform init
          -backend-config="key=nanoclaw/prod/terraform.tfstate"

      - name: Terraform Apply
        working-directory: infra
        run: >-
          terraform apply
          -var-file=envs/prod.tfvars
          -auto-approve
